name: Build Keyboard APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip project
      run: unzip keyboard.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate gradlew with Gradle 8.2
      run: |
        cd Kiyan-Keyboard-Professional-v2
        gradle wrapper --gradle-version 8.2 --distribution-type bin
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        cd Kiyan-Keyboard-Professional-v2
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Keyboard-APK
        path: Kiyan-Keyboard-Professional-v2/app/build/outputs/apk/debug/app-debug.apk
